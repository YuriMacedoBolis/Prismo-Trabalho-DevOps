# =============================================================================
#  Prismo — stack de aplicacao (Fase 1)
#
#  Suba com:  docker compose up --build
#  Com observabilidade:  docker compose -f docker-compose.yml -f docker-compose.obs.yml up --build
#
#  Note o `context: .` em todos os builds: o contexto e a raiz do repositorio
#  porque cada imagem precisa copiar `shared/` junto com o seu proprio codigo.
# =============================================================================

name: prismo

x-app-common: &app-common
  restart: unless-stopped
  env_file: [.env]
  networks: [prismo]
  # Limites de recurso. Em producao o equivalente sao `requests` e `limits` no
  # Deployment do Kubernetes, e e deles que o HPA se serve para decidir
  # escalar. Definir aqui evita que um servico com vazamento de memoria
  # derrube a maquina de quem desenvolve.
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }
      reservations: { cpus: "0.1", memory: 128M }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---------------------------------------------------------------------------
  #  Redis — cache, fila do Celery, rate limiting e locks distribuidos.
  #  Estado descartavel: o que vale aqui pode ser perdido sem prejuizo.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: prismo-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # allkeys-lru: ao encher, o Redis descarta a chave menos usada em vez de
    # recusar escrita. Correto aqui porque todo o conteudo e descartavel:
    # cache perdido se refaz, e a verdade esta sempre no Postgres.
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    networks: [prismo]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  #  Postgres — banco da aplicacao, fonte de verdade dos dados.
  #
  #  Roda no proprio cluster, nao em servico gerenciado. Com isso assumimos o
  #  backup, e em troca ganhamos o que mais importa para este trabalho: e aqui
  #  que `StatefulSet` e `PersistentVolumeClaim` sao demonstrados no Kubernetes.
  #  Ver docs/decisoes/001.
  #
  #  A senha e trivial de proposito: banco local, descartavel, que nunca sai da
  #  maquina de quem desenvolve. Em producao vem de um Secret do Kubernetes.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: prismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prismo
      POSTGRES_PASSWORD: prismo
      POSTGRES_DB: prismo
      # Acelera a inicializacao em disco local; em producao seria removido,
      # porque desliga a garantia de durabilidade apos queda abrupta.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [prismo]
    healthcheck:
      # pg_isready so responde quando o banco aceita conexao de verdade. Os
      # servicos que dependem dele esperam por este healthcheck, e nao pelo
      # container ter sido criado.
      test: ["CMD-SHELL", "pg_isready -U prismo -d prismo"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  #  Migrator — execucao unica: aplica as migrations e encerra.
  #
  #  Nao e um servico: sobe, roda `alembic upgrade head`, sai com codigo 0.
  #  Os servicos de dominio esperam por ele com
  #  `condition: service_completed_successfully`, entao nenhum deles chega a
  #  consultar uma tabela que ainda nao existe.
  #
  #  Por que nao migrar no startup de cada servico: com varias replicas, todas
  #  aplicariam DDL ao mesmo tempo na mesma tabela. Aqui exatamente um
  #  processo migra. No Kubernetes o equivalente e um Job ou um initContainer.
  # ---------------------------------------------------------------------------
  migrator:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: prismo/migrator:0.1.0
    container_name: prismo-migrator
    env_file: [.env]
    networks: [prismo]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  #  Auth — contas, autenticacao e emissao de tokens. Dono do schema `auth`.
  # ---------------------------------------------------------------------------
  auth:
    <<: *app-common
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: prismo/auth:0.1.0
    container_name: prismo-auth
    environment:
      SERVICE_NAME: auth
    # Sem `ports`: so o gateway alcanca este servico, pela rede interna. E o
    # que permite confiar no header X-Usuario-Id que ele repassa.
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  #  Portfolio — perfis, projetos, temas e score. Dono do schema `portfolio`.
  # ---------------------------------------------------------------------------
  portfolio:
    <<: *app-common
    build:
      context: .
      dockerfile: services/portfolio/Dockerfile
    image: prismo/portfolio:0.1.0
    container_name: prismo-portfolio
    environment:
      SERVICE_NAME: portfolio
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  #  Sync — API dos conectores. Enfileira trabalho, nao o executa.
  # ---------------------------------------------------------------------------
  sync:
    <<: *app-common
    build:
      context: .
      dockerfile: services/sync/Dockerfile
    image: prismo/sync:0.1.0
    container_name: prismo-sync
    environment:
      SERVICE_NAME: sync
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  #  Worker — Celery. Executa a sincronizacao de fato.
  #
  #  E o servico que justifica o HorizontalPodAutoscaler: a carga de
  #  sincronizacao e irregular por natureza, e escalar por tamanho de fila
  #  responde a uma variacao real. `docker compose up --scale worker=3`
  #  demonstra isso localmente.
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-common
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: prismo/worker:0.1.0
    # Sem `container_name`: nome fixo impede escalar, e este e exatamente o
    # servico que precisa de varias replicas.
    #   docker compose up -d --scale worker=3
    # No Kubernetes o equivalente e `replicas` no Deployment, ajustado pelo
    # HorizontalPodAutoscaler conforme o tamanho da fila.
    environment:
      SERVICE_NAME: worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  #  Beat — agendador. SINGLETON: nunca mais de uma instancia.
  #
  #  Duas instancias agendando a mesma tarefa a enfileirariam duas vezes a
  #  cada intervalo. Por isso fica separado do worker, que escala a vontade.
  #
  #  Usa a MESMA imagem do worker, so com outro comando: o codigo e identico,
  #  muda apenas o papel. Uma imagem a menos para construir e versionar.
  # ---------------------------------------------------------------------------
  beat:
    <<: *app-common
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: prismo/worker:0.1.0
    container_name: prismo-beat
    environment:
      SERVICE_NAME: beat
    # Guarda o ultimo horario em /tmp, gravavel pelo usuario nao-root. Sem
    # isso o Beat reenfileiraria tudo a cada reinicio.
    command: >
      celery -A app.celery_app beat
      --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule
    # O healthcheck da imagem pergunta a um WORKER se ele responde; o Beat
    # nao e worker e falharia sempre.
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }
      worker: { condition: service_started }

  # ---------------------------------------------------------------------------
  #  SEO — meta tags, dados estruturados, sitemap e auditoria.
  # ---------------------------------------------------------------------------
  seo:
    <<: *app-common
    build:
      context: .
      dockerfile: services/seo/Dockerfile
    image: prismo/seo:0.1.0
    container_name: prismo-seo
    environment:
      SERVICE_NAME: seo
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  #  Gateway — unico servico da API exposto para fora.
  # ---------------------------------------------------------------------------
  gateway:
    <<: *app-common
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: prismo/gateway:0.1.0
    container_name: prismo-gateway
    environment:
      SERVICE_NAME: gateway
    ports: ["8001:8000"]
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
      portfolio: { condition: service_started }
      sync: { condition: service_started }
      seo: { condition: service_started }

  # ---------------------------------------------------------------------------
  #  Web — renderizacao server-side (landing, status, portfolio publico).
  # ---------------------------------------------------------------------------
  web:
    <<: *app-common
    build:
      context: .
      dockerfile: services/web/Dockerfile
    image: prismo/web:0.1.0
    container_name: prismo-web
    environment:
      SERVICE_NAME: web
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      gateway: { condition: service_started }

networks:
  prismo:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
