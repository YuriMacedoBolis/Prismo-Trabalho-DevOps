# =============================================================================
#  Alembic — configuracao de migrations
#
#  A URL do banco NAO fica aqui: ela e lida de DATABASE_URL em env.py. Deixar
#  credencial em arquivo versionado e exatamente o que o .gitignore existe para
#  evitar.
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .

# Nome dos arquivos de migration: data + hora + slug, para que a ordem
# cronologica seja obvia na listagem do diretorio.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
